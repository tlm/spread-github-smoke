# Smoke-test workflow for tlm/spread's spread-github composite action.
#
# Provisions lxd on the runner, then invokes the action to run a small
# spread project (one passing task, one failing task) and surface each
# task as a GitHub Check Run.

name: spread

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build spread from source
        run: |
          git clone --branch spread-events --depth 1 https://github.com/tlm/spread.git .spread-src
          cd .spread-src
          go build -o "$HOME/.local/bin/spread" ./cmd/spread
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Set up lxd
        uses: canonical/setup-lxd@v0.1.2

      - name: Add snap binaries to PATH
        run: echo /snap/bin >> "$GITHUB_PATH"

      - name: Run spread tests
        uses: tlm/spread/.github/actions/spread-github@spread-events
        with:
          spread-args: "lxd:ubuntu-24.04:tests/"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
