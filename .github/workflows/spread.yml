# Smoke-test workflow for tlm/spread's spread-github composite action.
#
# Provisions lxd on the runner, then invokes the action to run a small
# spread project (one passing task, one failing task) and surface each
# task as a GitHub Check Run.

name: spread

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install spread
        run: sudo snap install spread --classic

      - name: Set up lxd
        uses: canonical/setup-lxd@v0.1.2

      - name: Run spread tests
        uses: tlm/spread/.github/actions/spread-github@spread-events
        with:
          spread-binary: /snap/bin/spread
          spread-args: "lxd:ubuntu-24.04:tests/"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PATH: /snap/bin:${{ env.PATH }}
